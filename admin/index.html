<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Editor — Portfolio</title>
  <link rel="stylesheet" href="/admin/css/editor.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-logo">JSC<span>.</span> Editor</h1>
      </div>

      <div class="sidebar-search">
        <input type="text" id="search-input" placeholder="Search items..." />
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-section-btn active" data-type="projects">
          <span class="sidebar-icon">P</span> Projects
          <span class="sidebar-count" id="count-projects">0</span>
        </button>
        <button class="sidebar-section-btn" data-type="collections">
          <span class="sidebar-icon">C</span> Collections
          <span class="sidebar-count" id="count-collections">0</span>
        </button>
        <button class="sidebar-section-btn" data-type="insights">
          <span class="sidebar-icon">I</span> Insights
          <span class="sidebar-count" id="count-insights">0</span>
        </button>
        <button class="sidebar-section-btn" data-type="hero">
          <span class="sidebar-icon">H</span> Hero / Bio
        </button>
        <button class="sidebar-section-btn" data-type="skills">
          <span class="sidebar-icon">S</span> Skills
        </button>
        <button class="sidebar-section-btn" data-type="manifest">
          <span class="sidebar-icon">M</span> Manifest / Order
        </button>
      </nav>

      <div id="item-list" class="sidebar-items"></div>

      <div class="sidebar-actions">
        <button id="btn-new" class="btn btn-primary">+ New Item</button>
        <button id="btn-build" class="btn btn-accent">Build Site</button>
      </div>
    </aside>

    <!-- Main editor area -->
    <main id="main">
      <!-- Error banner -->
      <div id="error-banner" class="error-banner hidden"></div>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state">
        <div class="empty-state-icon">JSC</div>
        <h2>Content Editor</h2>
        <p>Select an item from the sidebar to edit, or create a new one.</p>
      </div>

      <!-- Editor form (hidden until item selected) -->
      <div id="editor-panel" class="editor-panel hidden">
        <div class="editor-header">
          <div class="editor-header-left">
            <span class="editor-type-badge" id="editor-type-badge"></span>
            <h2 class="editor-title" id="editor-title">New Item</h2>
          </div>
          <div class="editor-header-actions">
            <button id="btn-preview" class="btn btn-outline">Preview</button>
            <button id="btn-save" class="btn btn-primary">Save</button>
            <button id="btn-delete" class="btn btn-danger">Delete</button>
          </div>
        </div>

        <!-- Validation summary -->
        <div id="validation-summary" class="validation-summary hidden"></div>

        <!-- Tab bar for editor sections -->
        <div class="editor-tabs">
          <button class="editor-tab active" data-tab="metadata">Metadata</button>
          <button class="editor-tab" data-tab="content">Content / Blocks</button>
          <button class="editor-tab" data-tab="preview">Preview</button>
        </div>

        <!-- Metadata tab -->
        <div class="editor-tab-panel active" data-panel="metadata">
          <div id="metadata-fields"></div>
        </div>

        <!-- Content/Blocks tab -->
        <div class="editor-tab-panel" data-panel="content">
          <div id="blocks-editor"></div>
        </div>

        <!-- Preview tab -->
        <div class="editor-tab-panel" data-panel="preview">
          <div class="preview-toolbar">
            <button class="preview-mode-btn active" data-mode="desktop">Desktop</button>
            <button class="preview-mode-btn" data-mode="mobile">Mobile</button>
          </div>
          <div id="preview-frame" class="preview-frame"></div>
        </div>
      </div>

      <!-- Hero editor -->
      <div id="hero-panel" class="editor-panel hidden">
        <div class="editor-header">
          <div class="editor-header-left">
            <span class="editor-type-badge badge-hero">HERO</span>
            <h2 class="editor-title">Hero / Bio Settings</h2>
          </div>
          <div class="editor-header-actions">
            <button id="btn-save-hero" class="btn btn-primary">Save</button>
          </div>
        </div>
        <div id="hero-fields" class="form-section"></div>
      </div>

      <!-- Skills editor -->
      <div id="skills-panel" class="editor-panel hidden">
        <div class="editor-header">
          <div class="editor-header-left">
            <span class="editor-type-badge badge-skills">SKILLS</span>
            <h2 class="editor-title">Skills in Context</h2>
          </div>
          <div class="editor-header-actions">
            <button id="btn-save-skills" class="btn btn-primary">Save</button>
          </div>
        </div>
        <div id="skills-fields" class="form-section"></div>
      </div>

      <!-- Manifest editor -->
      <div id="manifest-panel" class="editor-panel hidden">
        <div class="editor-header">
          <div class="editor-header-left">
            <span class="editor-type-badge badge-manifest">MANIFEST</span>
            <h2 class="editor-title">Manifest / Ordering</h2>
          </div>
          <div class="editor-header-actions">
            <button id="btn-save-manifest" class="btn btn-primary">Save</button>
          </div>
        </div>
        <div id="manifest-fields" class="form-section"></div>
      </div>
    </main>
  </div>

  <!-- Build output modal -->
  <div id="build-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-box-header">
        <h3>Build Output</h3>
        <button class="modal-box-close" id="build-modal-close">&times;</button>
      </div>
      <pre id="build-output" class="build-output"></pre>
    </div>
  </div>

  <script src="/admin/js/editor.js"></script>
</body>
</html>
