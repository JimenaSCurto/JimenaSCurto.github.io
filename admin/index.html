<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin — Edit Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <header class="admin-header">
    <div>
      <h1>Edit Projects</h1>
      <p>Local editor for <code>data/projects.json</code>. Nothing here is saved automatically — download the file when you're done and commit it to the repo.</p>
    </div>
    <a class="btn-link" href="../index.html#work">← back to site</a>
  </header>

  <div class="admin-toolbar">
    <button id="add-project" class="btn-primary" type="button">+ Add project</button>
    <button id="load-file" class="btn-primary" type="button">Load projects.json…</button>
    <input type="file" id="file-input" accept="application/json" hidden>
    <button id="download-file" class="btn-primary" type="button">Download projects.json</button>
    <span id="status" class="admin-status"></span>
  </div>

  <div id="admin-list" class="admin-list"></div>

  <template id="card-template">
    <div class="admin-card" draggable="true">
      <div class="admin-card-row admin-card-handle">
        <span class="drag-grip">⠿</span>
        <span class="card-index"></span>
        <button class="btn-link remove-btn" type="button">remove</button>
      </div>
      <div class="admin-card-grid">
        <label>Number
          <input type="text" data-field="num" placeholder="01">
        </label>
        <label>Category key
          <select data-field="cat">
            <option value="nlp-politics">nlp-politics</option>
            <option value="nlp-literature">nlp-literature</option>
            <option value="data-viz">data-viz</option>
          </select>
        </label>
        <label>Category label
          <input type="text" data-field="catLabel" placeholder="NLP · Politics">
        </label>
        <label>Tags
          <input type="text" data-field="tags" placeholder="Python · spaCy · 2024">
        </label>
        <label class="span-2">Title
          <input type="text" data-field="title" placeholder="Project title">
        </label>
        <label class="span-2">Description
          <textarea data-field="desc" rows="2" placeholder="One-line description"></textarea>
        </label>
        <label>Image path
          <input type="text" data-field="img" placeholder="images/example.webp">
        </label>
        <label>Image alt text
          <input type="text" data-field="alt" placeholder="Describes the thumbnail">
        </label>
      </div>
      <div class="admin-preview"></div>
    </div>
  </template>

  <script src="admin.js"></script>
</body>
</html>
